  <text x="82" y="470" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-style="italic" fill="#cbd5e1">“Código que funciona, personas que confían, proyectos que perduran.”</text>
  <text x="1515" y="470" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#38bdf8">PRESERVAR → REVISAR → CAMBIO MÍNIMO → VALIDAR → PROBAR → DOCUMENTAR</text>
