    <g transform="translate(975)"><rect width="122" height="70" rx="14" fill="#071827" stroke="#0ea5e9"/><text x="61" y="30" fill="#38bdf8" font-size="22">🔒</text><text x="61" y="56" fill="#e2e8f0">MFA</text></g>
