<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Juan Diego Sánchez — Licenciado en Sistemas, Jefe de IT y Desarrollador Full Stack</title>
  <desc id="desc">Banner tecnológico en tonos azul oscuro y cian con software, infraestructura, seguridad, automatización e inteligencia artificial.</desc>
